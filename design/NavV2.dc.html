<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.nl{font-size:14px;color:#2E3A4F;text-decoration:none;padding:0 13px;min-height:68px;display:flex;align-items:center;background:transparent;border:0;font-family:inherit;cursor:pointer;gap:6px}
.nl:hover{color:#0A0F1C}
.dl{display:flex;flex-direction:column;gap:2px;padding:12px 16px;text-decoration:none;color:#0A0F1C;min-height:44px;box-sizing:border-box}
.dl:hover{background:#EAF0FE}
a:focus-visible,button:focus-visible{outline:2px solid #1D4ED8;outline-offset:-2px}
</style>
</helmet>
<div style="width: 1440px; height: 560px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #0A0F1C; background: #F5F6F8;">

  <header style="background: #FFFFFF; border-bottom: 1px solid #0A0F1C; position: relative;">
    <nav aria-label="Primary" style="max-width: 1240px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0A0F1C; min-height: 68px;">
          <span class="mono" style="position: relative; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #0A0F1C; color: #FFFFFF; font-size: 13px; font-weight: 600;">IN<span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; width: 10px; height: 10px; background: #1D4ED8;"></span></span>
          <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">Irfan Noor Mohammed</span>
        </a>
        <span class="mono" style="display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.06em; color: #1E40AF; background: #EAF0FE; padding: 6px 10px;"><span aria-hidden="true" style="width: 7px; height: 7px; background: #1D4ED8;"></span>OPEN TO ROLES</span>
      </div>
      <div style="display: flex; align-items: center;">
        <a href="Work.dc.html" class="nl">Work</a>
        <div style="position: relative;">
          <button type="button" class="nl" aria-expanded="{{expanded}}" aria-controls="about-menu" onClick="{{toggle}}" style="{{aboutStyle}}">About
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="{{chev}}"></path></svg>
          </button>
          <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
            <div id="about-menu" style="position: absolute; top: 68px; left: 0; width: 280px; background: #FFFFFF; border: 1px solid #0A0F1C; box-shadow: 0 16px 40px rgba(10, 15, 28, 0.18); padding: 6px 0; z-index: 2;">
              <a href="Experience.dc.html" class="dl"><span style="font-size: 15px; font-weight: 600;">Experience</span><span style="font-size: 13px; color: #556274;">Roles, what I built, stack</span></a>
              <a href="Skills.dc.html" class="dl"><span style="font-size: 15px; font-weight: 600;">Skills</span><span style="font-size: 13px; color: #556274;">Tiered, with evidence</span></a>
              <a href="Journey.dc.html" class="dl"><span style="font-size: 15px; font-weight: 600;">Journey</span><span style="font-size: 13px; color: #556274;">Milestones, 2023 → now</span></a>
              <div style="border-top: 1px solid #DCE1E8; margin: 6px 0;"></div>
              <a href="Resume.dc.html" class="dl" style="flex-direction: row; justify-content: space-between; align-items: center;"><span style="font-size: 14px; font-weight: 500;">Résumé</span><span class="mono" style="font-size: 12px; color: #1D4ED8;">one page →</span></a>
            </div>
          </sc-if>
        </div>
        <a href="Notes.dc.html" class="nl">Notes</a>
        <a href="Infrastructure.dc.html" class="nl">Infra</a>
        <a href="Terminal.dc.html" class="nl"><span class="mono" style="font-size: 12px; color: #1D4ED8;">&gt;_</span>Terminal</a>
        <a href="Contact.dc.html" class="nl">Contact</a>
        <a href="Search.dc.html" class="mono" style="margin-left: 8px; font-size: 12px; color: #2E3A4F; text-decoration: none; border: 1px solid #C9D1DC; padding: 0 12px; min-height: 44px; display: flex; align-items: center; gap: 10px;">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="5.5"></circle><path d="M12.2 12.2 16 16"></path></svg>Search <span style="border: 1px solid #C9D1DC; padding: 1px 5px;">Ctrl K</span>
        </a>
        <a href="Dark.dc.html" aria-label="Switch to dark theme" style="margin-left: 8px; width: 44px; height: 44px; border: 1px solid #C9D1DC; display: flex; align-items: center; justify-content: center; color: #0A0F1C;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"></path></svg>
        </a>
        <a href="Resume.dc.html" style="margin-left: 8px; font-size: 14px; font-weight: 500; color: #FFFFFF; background: #0A0F1C; text-decoration: none; padding: 0 18px; min-height: 44px; display: flex; align-items: center;">Résumé</a>
      </div>
    </nav>
  </header>

  <div aria-hidden="true" style="max-width: 1240px; margin: 0 auto; padding: 56px 40px; display: flex; flex-direction: column; gap: 24px; opacity: 0.45;">
    <div style="width: 320px; height: 12px; background: #C9D1DC;"></div>
    <div style="font-size: 88px; line-height: 0.95; font-weight: 600; letter-spacing: -0.045em;">Irfan Noor Mohammed</div>
    <div style="display: flex; gap: 48px;"><div style="flex: 1; height: 160px; border-top: 1px solid #0A0F1C;"></div><div style="flex: 1.45; height: 160px; background: #FFFFFF; border: 1px solid #0A0F1C;"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
  }
  renderVals() {
    const open = this.state.open;
    return {
      open,
      expanded: open ? 'true' : 'false',
      chev: open ? 'M3 7.5 6 4.5l3 3' : 'M3 4.5 6 7.5l3-3',
      aboutStyle: open ? 'color: #0A0F1C; font-weight: 600; box-shadow: inset 0 -2px 0 #1D4ED8;' : '',
      toggle: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
