<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.chip{flex:0 0 auto;font-family:'Geist Mono',monospace;font-size:13px;color:#E2E8F0;background:transparent;border:1px solid #3A465C;padding:0 14px;min-height:44px;cursor:pointer}
#mt-in:focus{outline:none}
a:focus-visible,button:focus-visible{outline:2px solid #8FB0FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; font-family: 'Geist', system-ui, sans-serif; background: #0A0F1C; color: #E2E8F0; display: flex; flex-direction: column;">
  <header style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2A3548;">
    <a href="HomeV2Mobile.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; min-height: 44px;">
      <span class="mono" style="position: relative; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: #0A0F1C; font-size: 12px; font-weight: 600;">IN<span aria-hidden="true" style="position: absolute; right: -3px; bottom: -3px; width: 8px; height: 8px; background: #7FA2FF;"></span></span>
      <span class="mono" style="font-size: 13px;">irfan@portfolio:~</span>
    </a>
    <a href="HomeV2Mobile.dc.html" aria-label="Close terminal" style="width: 44px; height: 44px; border: 1px solid #3A465C; display: flex; align-items: center; justify-content: center; color: #FFFFFF;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l10 10M14 4 4 14"></path></svg></a>
  </header>

  <div ref="{{outRef}}" role="log" aria-live="polite" aria-label="Terminal output" class="mono" style="flex: 1; overflow-y: auto; padding: 16px; font-size: 13px; line-height: 1.65;">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
      <sc-if value="{{l.isLink}}" hint-placeholder-val="{{ false }}"><div><a href="{{l.href}}" style="color: #8FB0FF;">{{l.text}}</a></div></sc-if>
      <sc-if value="{{l.isText}}" hint-placeholder-val="{{ true }}"><div style="{{l.style}}">{{l.text}}</div></sc-if>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; border-top: 1px solid #2A3548;">
    <div role="group" aria-label="Quick commands" style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button type="button" class="chip" onClick="{{c.run}}">{{c.cmd}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 16px 20px;">
      <label for="mt-in" class="mono" style="font-size: 13px; color: #8FB0FF;">$<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);"> command</span></label>
      <input id="mt-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" value="{{value}}" onChange="{{onChange}}" onKeyDown="{{onKeyDown}}" placeholder="type or tap a command" class="mono" style="flex: 1; min-width: 0; background: #111A2E; border: 1px solid #2A3548; color: #FFFFFF; font-size: 16px; min-height: 48px; padding: 0 12px; box-sizing: border-box;">
      <button type="button" aria-label="Run command" onClick="{{submit}}" style="width: 48px; height: 48px; background: #8FB0FF; border: 0; color: #0A0F1C; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { value: '', lines: [{ k: 'head', t: 'Shipped Blueprint shell' }, { k: 'dim', t: 'Tap a command below, or type `help`.' }] };
    this.outRef = (el) => { this.out = el; };
  }
  componentDidUpdate() { if (this.out) this.out.scrollTop = this.out.scrollHeight; }
  exec(raw) {
    const p = raw.trim().split(/\s+/);
    const c = (p[0] || '').toLowerCase();
    const a = (p[1] || '').toLowerCase();
    const o = (t) => ({ k: 'out', t: t });
    const d = (t) => ({ k: 'dim', t: t });
    const L = (t, h) => ({ k: 'link', t: t, href: h });
    switch (c) {
      case 'help': return [o('whoami  projects  open <id>'), o('skills  journey  pipeline'), o('contact  resume  clear')];
      case 'whoami': return [o('Irfan Noor Mohammed — software engineer building toward DevOps & cloud.'), d('Mumbai · open to roles')];
      case 'projects': return [o('p-01  dev   C2 — Continuous Control'), o('p-00  site  This portfolio'), o('p-02  lab   Container app + MySQL'), o('p-03  lab   CI/CD pipeline lab'), o('p-04  plan  Run it on AWS'), d('open <id> for details')];
      case 'open': {
        const m = { 'p-01': ['C2 case study →', 'CaseStudyMobile.dc.html'], 'p-00': ['This portfolio →', 'SiteProject.dc.html'], 'p-02': ['Container lab →', 'ContainerLab.dc.html'], 'p-03': ['CI/CD lab →', 'CicdLab.dc.html'] };
        if (a === 'p-04') return [d('p-04 is planned — no page yet.')];
        return m[a] ? [L(m[a][0], m[a][1])] : [{ k: 'err', t: 'open: unknown id — try `projects`' }];
      }
      case 'skills': return [o('work      react ts node mysql git'), o('projects  bash linux docker'), o('learning  actions jenkins aws')];
      case 'journey': return [o('2026  WiseTech MEP · M.Sc. IT'), o('2025  internship · Arba'), o('2023  started B.Sc. IT'), L('Full timeline →', 'Journey.dc.html')];
      case 'pipeline': return [o('push → check → build → audit → deploy'), d('[sha] · [build date]')];
      case 'contact': return [o('email  [your email]'), L('Contact page →', 'Contact.dc.html')];
      case 'resume': return [L('Open the résumé →', 'Resume.dc.html')];
      case 'sudo': return [{ k: 'err', t: 'not in the sudoers file.' }, d('`contact` works without root.')];
      case '': return [];
      default: return [{ k: 'err', t: 'command not found: ' + c }];
    }
  }
  run(raw) {
    if (raw.trim().toLowerCase() === 'clear') { this.setState({ lines: [], value: '' }); return; }
    this.setState({ lines: this.state.lines.concat([{ k: 'in', t: '$ ' + raw.trim() }], this.exec(raw)), value: '' });
  }
  renderVals() {
    const ST = { in: 'color: #8FB0FF; margin-top: 6px; white-space: pre-wrap;', out: 'white-space: pre-wrap;', dim: 'color: #9AA6B8; white-space: pre-wrap;', head: 'color: #FFFFFF; font-weight: 600;', err: 'color: #FCA5A5; white-space: pre-wrap;' };
    return {
      lines: this.state.lines.map((l) => ({ text: l.t, href: l.href, isLink: l.k === 'link', isText: l.k !== 'link', style: ST[l.k] || ST.out })),
      value: this.state.value,
      onChange: (e) => this.setState({ value: e.target.value }),
      onKeyDown: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.run(this.state.value); } },
      submit: () => this.run(this.state.value),
      chips: ['whoami', 'projects', 'skills', 'journey', 'pipeline', 'contact', 'help'].map((c) => ({ cmd: c, run: () => this.run(c) })),
      outRef: this.outRef
    };
  }
}
</script>
</body>
</html>
